[package]
name = "trit-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust 宿主骨架：模型/工具循环、效果台账与完成裁决"

[dependencies]
trit-orch.workspace = true
trit-reasonix.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "2.12"
ring = "0.17"
subtle = "2.6"
cap-std = "3"
cap-fs-ext = "3"
notify = "8"
ignore = "0.4"
regex = "1"
globset = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bench]]
name = "session_scan"
harness = false

[[bench]]
name = "protocol_matrix"
harness = false

[[bench]]
name = "permission_matrix"
harness = false

[[bench]]
name = "tech_stack_matrix"
harness = false

[[bench]]
name = "tools_batch"
harness = false

[[bench]]
name = "journal_bench"
harness = false
