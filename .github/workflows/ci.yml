name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            args: --workspace
            install_gcc: true
          - target: loongarch64-unknown-linux-gnu
            args: --workspace --exclude trit-host
            install_gcc: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.install_gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo check ${{ matrix.args }} --all-targets --target ${{ matrix.target }}

  stress:
    name: runtime + chaos invariants (repeat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 崩溃点回放：串行跑，避免测试之间共享临时文件掩盖恢复顺序问题。
      - name: crash-point replay (serial)
        run: cargo test --locked -p trit-orch --test recovery --test durable --test trace_replay -- --test-threads=1
      # 同一批并发/预算不变量换两种并行度重复跑，抓调度窗口里的偶发失败。
      - name: concurrency invariants (threads=1, then default)
        run: |
          set -e
          for threads in 1 4; do
            echo "::group::test-threads=$threads"
            cargo test --locked -p trit-orch \
              --test tick --test coordination --test claim_gate_parity --test budgets \
              -- --test-threads=$threads
            echo "::endgroup::"
          done
      # 子进程崩溃/重启与 MCP 握手：多轮重跑，专抓端口、临时目录与 wait 线程的竞态。
      - name: supervisor restart + MCP handshake (5 rounds)
        run: |
          set -e
          for round in 1 2 3 4 5; do
            echo "::group::supervisor round $round"
            cargo test --locked -p trit-host --test supervisor_cli -- --test-threads=1
            echo "::endgroup::"
          done
